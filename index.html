<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자리뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #ffffff;
  --surface: #f7f8f5;
  --surface2: #eef0ea;
  --border: rgba(0,0,0,0.07);
  --border2: rgba(0,0,0,0.15);
  --text: #171c12;
  --text2: rgba(23,28,18,0.52);
  --text3: rgba(23,28,18,0.32);
  --accent: #ff5c35;
  --accent2: #e04a26;
  --accent-dim: rgba(255,92,53,0.1);
  --accent-dim2: rgba(255,92,53,0.05);
  --red: #d94f3d;
  --radius: 12px;
  --radius-sm: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  overflow-x: hidden;
}

/* 배경 grain */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  z-index: 100;
}

.nav-logo {
  font-family: 'Outfit', sans-serif;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--accent);
  display: flex;
  gap: 4px;
}

.nav-btn {
  padding: 7px 16px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text2);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 400;
  cursor: pointer;
  transition: all 0.2s;
}

.nav-btn:hover {
  border-color: var(--border2);
  color: var(--text);
  background: var(--surface);
}

.nav-btn.active {
  background: var(--surface2);
  border-color: var(--border2);
  color: var(--text);
}

/* ── PAGES ── */
.page { display: none; padding-top: 56px; min-height: 100vh; position: relative; z-index: 1; }
.page.active { display: block; }

/* ════════════════════════════
   자리뽑기 페이지
════════════════════════════ */
#page-reveal {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}
#page-reveal.active { display: flex; }

.reveal-hero {
  width: 100%;
  padding: 60px 32px 40px;
  text-align: center;
  position: relative;
}

/* 크고 강렬한 번호 */
.big-number {
  font-family: 'Outfit', sans-serif;
  font-size: clamp(120px, 22vw, 220px);
  line-height: 0.9;
  color: var(--accent);
  font-weight: 800;
  letter-spacing: -6px;
  transition: all 0.1s;
  min-height: 1em;
  display: flex;
  align-items: center;
  justify-content: center;
}

.big-number.spinning {
  animation: flicker 0.08s infinite;
}

@keyframes flicker {
  0%,100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.big-name {
  font-size: clamp(28px, 5vw, 48px);
  font-weight: 500;
  margin: 12px 0 8px;
  min-height: 1.2em;
  letter-spacing: -0.5px;
}

.big-seat {
  font-size: 18px;
  color: var(--text2);
  min-height: 28px;
  letter-spacing: 0.5px;
}

.reveal-status {
  font-size: 13px;
  color: var(--text3);
  margin-top: 6px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* 메인 버튼 */
.reveal-controls {
  display: flex;
  gap: 12px;
  margin: 32px 0 0;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
}

.btn-reveal-main {
  padding: 18px 48px;
  background: var(--accent);
  color: #ffffff;
  border: none;
  border-radius: var(--radius);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.5px;
  position: relative;
  overflow: hidden;
}

.btn-reveal-main::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0);
  transition: background 0.15s;
}

.btn-reveal-main:hover::after { background: rgba(255,255,255,0.12); }
.btn-reveal-main:active { transform: scale(0.98); }
.btn-reveal-main:disabled {
  background: var(--surface2);
  color: var(--text3);
  cursor: default;
}
.btn-reveal-main:disabled::after { display: none; }

.btn-reset {
  padding: 18px 24px;
  background: transparent;
  color: var(--text2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  font-weight: 400;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-reset:hover { border-color: var(--border2); color: var(--text); background: var(--surface); }

/* 진행도 바 */
.progress-bar-wrap {
  width: 100%;
  max-width: 480px;
  margin: 20px auto 0;
}

.progress-bar-track {
  height: 3px;
  background: var(--surface2);
  border-radius: 99px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.4s ease;
  width: 0%;
}

.progress-label {
  font-size: 12px;
  color: var(--text3);
  text-align: right;
  margin-top: 6px;
  letter-spacing: 0.5px;
}

/* 교실 배치도 (공개 화면) */
.reveal-classroom-wrap {
  width: 100%;
  padding: 0 32px 60px;
  max-width: 800px;
  margin: 0 auto;
}

.board-label {
  text-align: center;
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--text3);
  text-transform: uppercase;
  padding: 10px 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 20px;
  background: var(--surface);
}

.reveal-classroom-grid {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: nowrap;
}

.reveal-col { display: flex; flex-direction: column; gap: 8px; }

.reveal-desk {
  width: 76px;
  height: 50px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  text-align: center;
  color: var(--text3);
  background: var(--surface);
  padding: 4px;
  line-height: 1.4;
  transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
}

.reveal-desk.revealed {
  background: rgba(255,92,53,0.07);
  border-color: rgba(255,92,53,0.3);
  color: var(--text2);
}

.reveal-desk.highlight {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 500;
  transform: scale(1.1);
  box-shadow: 0 0 20px rgba(255,92,53,0.2);
}

/* not-ready 배너 */
.not-ready-banner {
  margin: 40px auto;
  max-width: 420px;
  padding: 20px 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-align: center;
  color: var(--text2);
  font-size: 14px;
  line-height: 1.7;
}

.not-ready-banner strong { color: var(--text); font-weight: 500; }

/* ════════════════════════════
   설정 페이지
════════════════════════════ */
#page-setup {
  max-width: 640px;
  margin: 0 auto;
  padding: 60px 32px;
}

.page-header {
  margin-bottom: 36px;
}

.page-title {
  font-family: 'Outfit', sans-serif;
  font-size: 40px;
  font-weight: 800;
  letter-spacing: -1px;
  color: var(--text);
}

.page-subtitle {
  font-size: 13px;
  color: var(--text3);
  margin-top: 6px;
  letter-spacing: 0.5px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 16px;
}

.card-title {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 16px;
}

.import-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

.btn-outline {
  padding: 10px 18px;
  background: transparent;
  color: var(--text2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 400;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-outline:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); }

.btn-primary {
  padding: 10px 20px;
  background: var(--accent);
  color: #ffffff;
  border: none;
  border-radius: var(--radius-sm);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary:hover { background: var(--accent2); }

.btn-danger {
  padding: 10px 18px;
  background: transparent;
  color: var(--red);
  border: 1px solid rgba(255,107,107,0.3);
  border-radius: var(--radius-sm);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-danger:hover { background: rgba(255,107,107,0.08); }

.paste-area {
  display: none;
  margin-top: 12px;
}

textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 300;
  padding: 12px;
  resize: vertical;
  min-height: 100px;
  outline: none;
  transition: border-color 0.2s;
}
textarea:focus { border-color: var(--border2); }
textarea::placeholder { color: var(--text3); }

.student-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.student-chip {
  padding: 5px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 99px;
  font-size: 12px;
  color: var(--text2);
}

.empty-hint {
  font-size: 13px;
  color: var(--text3);
  padding: 8px 0;
}

.save-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

.toast {
  position: fixed;
  bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--text);
  color: var(--bg);
  padding: 12px 24px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 700;
  z-index: 999;
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ════════════════════════════
   구조 페이지
════════════════════════════ */
#page-arrange {
  max-width: 900px;
  margin: 0 auto;
  padding: 60px 32px;
}

.arrange-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 24px;
  align-items: start;
}

.arrange-sidebar { position: sticky; top: 80px; }

.col-row-item {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.col-row-item label {
  font-size: 12px;
  color: var(--text3);
  width: 32px;
  letter-spacing: 0.5px;
}

input[type=number] {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  padding: 7px 10px;
  width: 64px;
  outline: none;
  transition: border-color 0.2s;
}
input[type=number]:focus { border-color: var(--accent); }

.col-badge {
  font-size: 11px;
  color: var(--text3);
  padding: 3px 8px;
  background: var(--surface2);
  border-radius: 99px;
}

/* 학생 칩들 (구조 탭) */
.arrange-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }

.arrange-chip {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 99px;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  background: var(--surface);
  transition: all 0.15s;
}
.arrange-chip:hover { border-color: var(--border2); color: var(--text); }
.arrange-chip.selected { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
.arrange-chip.placed { background: var(--surface2); color: var(--text3); text-decoration: line-through; cursor: default; }

/* 교실 그리드 (배치 탭) */
.arrange-classroom {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: nowrap;
  margin: 16px 0;
  overflow-x: auto;
  padding-bottom: 4px;
}

.arrange-col { display: flex; flex-direction: column; gap: 6px; }

.arrange-desk {
  width: 76px;
  height: 52px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  text-align: center;
  color: var(--text3);
  background: var(--surface);
  padding: 4px;
  line-height: 1.4;
  cursor: pointer;
  transition: all 0.15s;
}
.arrange-desk:hover { border-color: var(--border2); background: var(--surface2); }
.arrange-desk.assigned { background: var(--accent-dim); border-color: rgba(255,92,53,0.35); color: var(--accent); }
.arrange-desk.assigned:hover { background: rgba(255,92,53,0.15); }

.board-bar {
  text-align: center;
  padding: 8px 0;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text3);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
}

.arrange-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

/* divider */
.divider { height: 1px; background: var(--border); margin: 16px 0; }

/* small label */
.label-sm { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; display: block; }

/* responsive */
@media (max-width: 680px) {
  nav { padding: 0 16px; }
  .nav-logo { font-size: 18px; }
  .nav-btn { padding: 6px 12px; font-size: 12px; }
  #page-setup, #page-arrange { padding: 40px 16px; }
  .reveal-hero { padding: 40px 16px 24px; }
  .reveal-classroom-wrap { padding: 0 16px 40px; }
  .arrange-layout { grid-template-columns: 1fr; }
  .arrange-sidebar { position: static; }
}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">자리뽑기</div>
  <div class="nav-links">
    <button class="nav-btn active" id="nav-reveal" onclick="showPage('reveal')">자리뽑기</button>
    <button class="nav-btn" id="nav-setup" onclick="showPage('setup')">설정</button>
    <button class="nav-btn" id="nav-arrange" onclick="showPage('arrange')">구조</button>
  </div>
</nav>

<!-- ═══════ 자리뽑기 ═══════ -->
<div class="page active" id="page-reveal">

  <div id="reveal-not-ready" style="display:none;" class="not-ready-banner">
    <strong>아직 배치가 없어요.</strong><br>
    <span style="font-size:13px;">상단 <strong>설정</strong>에서 학생 명단을 입력하고,<br><strong>구조</strong>에서 자리를 배정한 뒤 저장해주세요.</span>
  </div>

  <div id="reveal-main-content">
    <div class="reveal-hero">
      <div class="reveal-status" id="reveal-status">버튼을 눌러 시작하세요</div>
      <div class="big-number" id="reveal-num">-</div>
      <div class="big-name" id="reveal-name"></div>
      <div class="big-seat" id="reveal-seat-text"></div>

      <div class="reveal-controls">
        <button class="btn-reveal-main" id="btn-next" onclick="revealNext()">▶ 1번 학생 공개</button>
        <button class="btn-reset" onclick="resetReveal()">↺ 처음부터</button>
      </div>

      <div class="progress-bar-wrap">
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <div class="progress-label" id="reveal-progress">0 / 0명</div>
      </div>
    </div>

    <div class="reveal-classroom-wrap">
      <div class="board-label">칠판</div>
      <div class="reveal-classroom-grid" id="reveal-grid"></div>
    </div>
  </div>
</div>

<!-- ═══════ 설정 ═══════ -->
<div class="page" id="page-setup">
  <div class="page-header">
    <div class="page-title">설정</div>
    <div class="page-subtitle">학생 명단을 입력하세요. 엑셀 파일 또는 붙여넣기로 불러올 수 있어요.</div>
  </div>

  <div class="card">
    <div class="card-title">학생 명단 불러오기</div>
    <div class="import-btns">
      <button class="btn-outline" onclick="togglePaste()">📋 엑셀에서 붙여넣기</button>
      <button class="btn-outline" onclick="document.getElementById('xlsx-input').click()">📂 .xlsx 파일 업로드</button>
      <input type="file" id="xlsx-input" accept=".xlsx,.xls" style="display:none" onchange="handleXlsx(this)">
    </div>
    <div class="paste-area" id="paste-area">
      <textarea id="paste-input" placeholder="엑셀에서 번호, 이름 두 열을 복사해서 붙여넣으세요&#10;예)&#10;1	홍길동&#10;2	김철수&#10;3	이영희"></textarea>
      <div style="margin-top:8px;">
        <button class="btn-primary" onclick="parsePaste()">불러오기</button>
      </div>
    </div>
    <div class="divider"></div>
    <span class="label-sm">현재 명단</span>
    <div id="student-list-display"><div class="empty-hint">아직 학생이 없습니다.</div></div>
  </div>

  <div class="save-actions">
    <button class="btn-primary" onclick="saveSettings()">저장</button>
    <button class="btn-danger" onclick="resetAll()">전체 초기화</button>
  </div>
</div>

<!-- ═══════ 구조 ═══════ -->
<div class="page" id="page-arrange">
  <div class="page-header">
    <div class="page-title">구조</div>
    <div class="page-subtitle">교실 열과 자리 수를 설정하고, 학생을 자리에 배정하세요.</div>
  </div>

  <div class="arrange-layout">
    <!-- 사이드바: 열 설정 -->
    <div class="arrange-sidebar">
      <div class="card">
        <div class="card-title">열 구조</div>
        <div class="col-row-item">
          <label>열 수</label>
          <input type="number" id="num-cols" min="1" max="10" value="5">
          <button class="btn-outline" style="padding:7px 12px; font-size:12px;" onclick="applyColCount()">적용</button>
        </div>
        <div class="divider"></div>
        <span class="label-sm">각 열의 자리 수</span>
        <div id="col-rows-setup"></div>
      </div>
      <div class="arrange-actions">
        <button class="btn-primary" onclick="saveArrangement()">배치 저장</button>
        <button class="btn-outline" onclick="clearArrangement()">초기화</button>
      </div>
    </div>

    <!-- 메인: 배치 -->
    <div>
      <div id="arrange-alert" style="display:none; margin-bottom:12px;" class="not-ready-banner">
        <strong>학생 명단을 먼저 입력하세요.</strong><br>
        <span style="font-size:12px;">설정 탭에서 명단을 불러온 뒤 돌아오세요.</span>
      </div>
      <span class="label-sm">학생 선택 → 자리 클릭으로 배정</span>
      <div class="arrange-chips" id="unplaced-students"></div>
      <div class="board-bar">칠판</div>
      <div class="arrange-classroom" id="arrange-grid"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let state = {
  cols: 5,
  colRows: [5,5,5,5,5],
  students: [],
  arrangement: {},
  selectedStudent: null,
  revealIndex: 0,
  revealing: false
};

function loadState() {
  try {
    const s = localStorage.getItem('jariState');
    if (s) {
      const parsed = JSON.parse(s);
      state = Object.assign(state, parsed);
    }
  } catch(e) {}
}

function saveToStorage() {
  try { localStorage.setItem('jariState', JSON.stringify(state)); } catch(e) {}
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── 탭 전환 ──
function showPage(p) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.getElementById('nav-'+p).classList.add('active');
  if (p === 'arrange') renderArrange();
  if (p === 'reveal') initReveal();
}

// ── 열 설정 ──
function applyColCount(silent) {
  const n = parseInt(document.getElementById('num-cols').value) || 5;
  state.cols = n;
  if (state.colRows.length !== n) {
    const old = state.colRows.slice();
    state.colRows = Array.from({length: n}, (_, i) => old[i] || 5);
  }
  renderColSetup();
  if (!silent) saveToStorage();
}

function renderColSetup() {
  document.getElementById('num-cols').value = state.cols;
  const el = document.getElementById('col-rows-setup');
  el.innerHTML = state.colRows.map((r, i) => `
    <div class="col-row-item">
      <label>${i+1}열</label>
      <input type="number" min="1" max="12" value="${r}"
        onchange="state.colRows[${i}]=parseInt(this.value)||1; saveToStorage();">
      <span class="col-badge">${r}자리</span>
    </div>`).join('');
}

// ── 학생 명단 ──
function togglePaste() {
  const el = document.getElementById('paste-area');
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function parsePaste() {
  const raw = document.getElementById('paste-input').value.trim();
  const lines = raw.split('\n').filter(l => l.trim());
  const students = [];
  for (const line of lines) {
    const parts = line.split('\t');
    if (parts.length >= 2) {
      const num = parseInt(parts[0].trim());
      const name = parts[1].trim();
      if (!isNaN(num) && name) students.push({num, name});
    }
  }
  if (!students.length) { alert('형식을 확인하세요. 번호[TAB]이름 형식이어야 합니다.'); return; }
  state.students = students.sort((a,b) => a.num-b.num);
  renderStudentList();
  document.getElementById('paste-area').style.display = 'none';
  saveToStorage();
  showToast(`${students.length}명 불러왔어요`);
}

function handleXlsx(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, {type:'binary'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1});
    const students = [];
    for (const row of rows) {
      if (row.length >= 2) {
        const num = parseInt(row[0]);
        const name = String(row[1]).trim();
        if (!isNaN(num) && name) students.push({num, name});
      }
    }
    if (!students.length) { alert('데이터를 찾을 수 없습니다. A열=번호, B열=이름 형식인지 확인하세요.'); return; }
    state.students = students.sort((a,b) => a.num-b.num);
    renderStudentList();
    saveToStorage();
    showToast(`${students.length}명 불러왔어요`);
  };
  reader.readAsBinaryString(file);
}

function renderStudentList() {
  const el = document.getElementById('student-list-display');
  if (!state.students.length) { el.innerHTML = '<div class="empty-hint">아직 학생이 없습니다.</div>'; return; }
  el.innerHTML = `<div class="student-chips">${state.students.map(s =>
    `<span class="student-chip">${s.num}. ${s.name}</span>`).join('')}</div>
    <div style="font-size:12px;color:var(--text3);margin-top:10px;">총 ${state.students.length}명</div>`;
}

function saveSettings() {
  saveToStorage();
  showToast('저장됐어요');
}

function resetAll() {
  if (!confirm('모든 데이터를 초기화할까요?')) return;
  state = {cols:5, colRows:[5,5,5,5,5], students:[], arrangement:{}, selectedStudent:null, revealIndex:0, revealing:false};
  saveToStorage();
  renderColSetup();
  renderStudentList();
  showToast('초기화됐어요');
}

// ── 구조(배치) ──
function deskKey(c, r) { return `${c}-${r}`; }

function renderArrange() {
  const alertEl = document.getElementById('arrange-alert');
  if (!state.students.length) { alertEl.style.display='block'; document.getElementById('unplaced-students').innerHTML=''; document.getElementById('arrange-grid').innerHTML=''; return; }
  alertEl.style.display = 'none';
  renderUnplaced();
  renderArrangeGrid();
}

function renderUnplaced() {
  const placed = new Set(Object.values(state.arrangement));
  document.getElementById('unplaced-students').innerHTML = state.students.map(s => {
    const isPlaced = placed.has(s.num);
    const isSel = state.selectedStudent === s.num;
    return `<span class="arrange-chip ${isPlaced?'placed':''} ${isSel?'selected':''}"
      onclick="${isPlaced?'':'selectStudent('+s.num+')'}">${s.num}. ${s.name}</span>`;
  }).join('');
}

function selectStudent(num) {
  state.selectedStudent = state.selectedStudent === num ? null : num;
  renderUnplaced();
}

function renderArrangeGrid() {
  document.getElementById('arrange-grid').innerHTML = state.colRows.map((rows, ci) => {
    const desks = Array.from({length:rows}, (_,ri) => {
      const key = deskKey(ci, ri);
      const sNum = state.arrangement[key];
      const s = sNum ? state.students.find(x => x.num===sNum) : null;
      return `<div class="arrange-desk ${s?'assigned':''}" onclick="assignDesk(${ci},${ri})">
        ${s ? `${s.num}. ${s.name}` : `<span style="font-size:9px;opacity:0.4;">${ci+1}열 ${ri+1}번</span>`}
      </div>`;
    }).join('');
    return `<div class="arrange-col">${desks}</div>`;
  }).join('');
}

function assignDesk(ci, ri) {
  const key = deskKey(ci, ri);
  if (state.selectedStudent) {
    const prev = Object.entries(state.arrangement).find(([k,v]) => v===state.selectedStudent);
    if (prev) delete state.arrangement[prev[0]];
    state.arrangement[key] = state.selectedStudent;
    state.selectedStudent = null;
    renderUnplaced();
    renderArrangeGrid();
  } else if (state.arrangement[key]) {
    if (confirm(`${state.arrangement[key]}번 학생 배치를 취소할까요?`)) {
      delete state.arrangement[key];
      renderArrangeGrid();
      renderUnplaced();
    }
  }
}

function saveArrangement() {
  saveToStorage();
  showToast('배치 저장됐어요');
}

function clearArrangement() {
  if (!confirm('배치를 전부 초기화할까요?')) return;
  state.arrangement = {};
  saveToStorage();
  renderArrange();
}

// ── 자리뽑기 ──
function initReveal() {
  const notReady = document.getElementById('reveal-not-ready');
  const main = document.getElementById('reveal-main-content');
  const hasData = state.students.length > 0 && Object.keys(state.arrangement).length > 0;
  notReady.style.display = hasData ? 'none' : 'block';
  main.style.opacity = hasData ? '1' : '0.25';
  main.style.pointerEvents = hasData ? '' : 'none';
  resetReveal();
}

function resetReveal() {
  state.revealIndex = 0;
  state.revealing = false;
  document.getElementById('reveal-num').textContent = '-';
  document.getElementById('reveal-num').classList.remove('spinning');
  document.getElementById('reveal-name').textContent = '';
  document.getElementById('reveal-seat-text').textContent = '';
  document.getElementById('reveal-status').textContent = '버튼을 눌러 시작하세요';
  const sorted = state.students.slice().sort((a,b)=>a.num-b.num);
  const btn = document.getElementById('btn-next');
  btn.textContent = sorted.length ? `▶ ${sorted[0].num}번 학생 공개` : '▶ 시작';
  btn.disabled = false;
  updateProgress();
  renderRevealGrid([], null);
}

function getStudentSeat(num) {
  for (const [key, n] of Object.entries(state.arrangement)) {
    if (n === num) {
      const [ci, ri] = key.split('-').map(Number);
      return {ci, ri, key};
    }
  }
  return null;
}

function revealNext() {
  if (state.revealing) return;
  const sorted = state.students.slice().sort((a,b)=>a.num-b.num);
  if (state.revealIndex >= sorted.length) return;

  const student = sorted[state.revealIndex];
  state.revealing = true;
  document.getElementById('btn-next').disabled = true;

  const numEl = document.getElementById('reveal-num');
  numEl.classList.add('spinning');
  numEl.textContent = student.num;
  document.getElementById('reveal-name').textContent = student.name;
  document.getElementById('reveal-seat-text').textContent = '...';
  document.getElementById('reveal-status').textContent = `${student.num}번 ${student.name}의 자리는?`;

  let tick = 0;
  const interval = setInterval(() => {
    tick++;
    if (tick >= 10) {
      clearInterval(interval);
      numEl.classList.remove('spinning');
      const seat = getStudentSeat(student.num);
      document.getElementById('reveal-seat-text').textContent = seat ? `${seat.ci+1}열 ${seat.ri+1}번 자리!` : '(미배정)';

      const revealedNums = sorted.slice(0, state.revealIndex+1).map(s=>s.num);
      renderRevealGrid(revealedNums, seat ? seat.key : null);

      state.revealIndex++;
      state.revealing = false;
      updateProgress();

      if (state.revealIndex >= sorted.length) {
        document.getElementById('btn-next').textContent = '✓ 전체 공개 완료';
        document.getElementById('btn-next').disabled = true;
        document.getElementById('reveal-status').textContent = '모든 자리 배치 완료!';
      } else {
        document.getElementById('btn-next').disabled = false;
        document.getElementById('btn-next').textContent = `▶ ${sorted[state.revealIndex].num}번 학생 공개`;
      }
    }
  }, 80);
}

function renderRevealGrid(revealedNums, highlightKey) {
  const set = new Set(revealedNums);
  document.getElementById('reveal-grid').innerHTML = state.colRows.map((rows, ci) => {
    const desks = Array.from({length:rows}, (_,ri) => {
      const key = deskKey(ci, ri);
      const sNum = state.arrangement[key];
      const isRevealed = sNum && set.has(sNum);
      const isHighlight = key === highlightKey;
      const s = sNum ? state.students.find(x=>x.num===sNum) : null;
      return `<div class="reveal-desk ${isRevealed?'revealed':''} ${isHighlight?'highlight':''}">
        ${isRevealed && s ? `${s.num}. ${s.name}` : ''}
      </div>`;
    }).join('');
    return `<div class="reveal-col">${desks}</div>`;
  }).join('');
}

function updateProgress() {
  const total = state.students.length;
  const done = state.revealIndex;
  document.getElementById('progress-fill').style.width = total ? `${(done/total)*100}%` : '0%';
  document.getElementById('reveal-progress').textContent = `${done} / ${total}명`;
}

// ── 초기화 ──
loadState();
renderColSetup();
renderStudentList();
initReveal();
</script>
</body>
</html>
